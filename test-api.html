<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 连通性测试 - 部署前必看</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #0a0e1a;
            color: #e0e8f0;
        }
        h1 { color: #00f5d4; }
        .test-group {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 16px;
            margin: 12px 0;
        }
        .test-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .test-item:last-child { border: none; }
        .status {
            width: 60px;
            height: 24px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .status.testing { background: #ff9d00; color: #000; }
        .status.pass { background: #2ed573; color: #000; }
        .status.fail { background: #ff4757; color: #fff; }
        .test-name { flex: 1; font-size: 13px; }
        .test-detail { font-size: 11px; color: #8b9bb4; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .btn {
            background: #00f5d4;
            color: #0a0e1a;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            margin: 8px 8px 8px 0;
        }
        .btn:hover { opacity: 0.8; }
        .summary {
            font-size: 14px;
            padding: 12px;
            border-radius: 6px;
            margin: 12px 0;
        }
        .summary.good { background: rgba(46, 213, 115, 0.15); border: 1px solid #2ed573; }
        .summary.bad { background: rgba(255, 71, 87, 0.15); border: 1px solid #ff4757; }
        pre {
            background: rgba(0,0,0,0.4);
            padding: 12px;
            border-radius: 6px;
            font-size: 11px;
            overflow-x: auto;
            max-height: 200px;
        }
    </style>
</head>
<body>
    <h1>🔍 API 连通性测试</h1>
    <p>在部署到 GitHub Pages 之前，先确认这些 API 在你的网络环境下是否可用。</p>
    
    <button class="btn" onclick="runAllTests()">▶️ 开始测试</button>
    <button class="btn" onclick="location.reload()">🔄 重置</button>
    
    <div class="summary" id="summary" style="display:none;"></div>
    
    <div class="test-group">
        <h3>🇨🇳 国内热点源</h3>
        <div class="test-item">
            <span class="status testing" id="s-vvhan-baidu">测试中</span>
            <span class="test-name">vvhan - 百度热搜</span>
            <span class="test-detail" id="d-vvhan-baidu"></span>
        </div>
        <div class="test-item">
            <span class="status testing" id="s-vvhan-zhihu">测试中</span>
            <span class="test-name">vvhan - 知乎热榜</span>
            <span class="test-detail" id="d-vvhan-zhihu"></span>
        </div>
        <div class="test-item">
            <span class="status testing" id="s-vvhan-weibo">测试中</span>
            <span class="test-name">vvhan - 微博热搜</span>
            <span class="test-detail" id="d-vvhan-weibo"></span>
        </div>
    </div>
    
    <div class="test-group">
        <h3>🌍 世界热点源</h3>
        <div class="test-item">
            <span class="status testing" id="s-hn">测试中</span>
            <span class="test-name">Hacker News (Firebase)</span>
            <span class="test-detail" id="d-hn"></span>
        </div>
        <div class="test-item">
            <span class="status testing" id="s-reddit">测试中</span>
            <span class="test-name">Reddit r/worldnews</span>
            <span class="test-detail" id="d-reddit"></span>
        </div>
    </div>
    
    <div class="test-group">
        <h3>🔀 CORS 代理（兜底）</h3>
        <div class="test-item">
            <span class="status testing" id="s-proxy1">测试中</span>
            <span class="test-name">allorigins.win</span>
            <span class="test-detail" id="d-proxy1"></span>
        </div>
        <div class="test-item">
            <span class="status testing" id="s-proxy2">测试中</span>
            <span class="test-name">corsproxy.io</span>
            <span class="test-detail" id="d-proxy2"></span>
        </div>
    </div>
    
    <div class="test-group">
        <h3>📋 测试结果</h3>
        <pre id="results">点击"开始测试"...</pre>
    </div>

    <script>
    const tests = [
        { id: 'vvhan-baidu', name: '百度热搜', url: 'https://api.vvhan.com/api/hotlist?type=baiduRD', parse: d => d?.data?.[0]?.data?.[0]?.title || 'unknown' },
        { id: 'vvhan-zhihu', name: '知乎热榜', url: 'https://api.vvhan.com/api/hotlist?type=zhihuHot', parse: d => d?.data?.[0]?.data?.[0]?.title || 'unknown' },
        { id: 'vvhan-weibo', name: '微博热搜', url: 'https://api.vvhan.com/api/hotlist?type=wbHot', parse: d => d?.data?.[0]?.data?.[0]?.title || 'unknown' },
        { id: 'hn', name: 'Hacker News', url: 'https://hacker-news.firebaseio.com/v0/topstories.json', parse: d => Array.isArray(d) ? `${d.length} items` : 'invalid' },
        { id: 'reddit', name: 'Reddit', url: 'https://www.reddit.com/r/worldnews/top.json?limit=5&t=day', parse: d => d?.data?.children?.[0]?.data?.title || 'unknown' },
        { id: 'proxy1', name: 'allorigins', url: 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://api.vvhan.com/api/hotlist?type=baiduRD'), parse: d => d?.data?.[0]?.data?.[0]?.title || 'unknown' },
        { id: 'proxy2', name: 'corsproxy', url: 'https://corsproxy.io/?url=' + encodeURIComponent('https://api.vvhan.com/api/hotlist?type=baiduRD'), parse: d => 'fetched' },
    ];
    
    async function runTest(test) {
        const statusEl = document.getElementById('s-' + test.id);
        const detailEl = document.getElementById('d-' + test.id);
        
        try {
            const controller = new AbortController();
            setTimeout(() => controller.abort(), 8000);
            
            const resp = await fetch(test.url, { signal: controller.signal });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            const result = test.parse(data);
            
            statusEl.className = 'status pass';
            statusEl.textContent = '✅ 通过';
            detailEl.textContent = result.length > 40 ? result.substring(0, 40) + '...' : result;
            return { name: test.name, pass: true, result };
        } catch (e) {
            statusEl.className = 'status fail';
            statusEl.textContent = '❌ 失败';
            detailEl.textContent = e.message.substring(0, 40);
            return { name: test.name, pass: false, error: e.message };
        }
    }
    
    async function runAllTests() {
        const results = [];
        
        for (const test of tests) {
            const result = await runTest(test);
            results.push(result);
        }
        
        // 汇总
        const passed = results.filter(r => r.pass).length;
        const total = results.length;
        const summary = document.getElementById('summary');
        summary.style.display = 'block';
        
        if (passed >= 3) {
            summary.className = 'summary good';
            summary.innerHTML = `✅ <strong>通过 ${passed}/${total}</strong> — 部署到 GitHub Pages 后实时数据大概率可用！<br>
                建议：确保 api.js 中的 CORS 代理列表包含可用的代理。`;
        } else if (passed >= 1) {
            summary.className = 'summary bad';
            summary.innerHTML = `⚠️ <strong>仅通过 ${passed}/${total}</strong> — 部署后可能只有部分实时数据。<br>
                建议：添加一个自己的 CORS 代理（Cloudflare Workers 免费），或在 api.js 中更换可用的代理地址。`;
        } else {
            summary.className = 'summary bad';
            summary.innerHTML = `❌ <strong>全部失败 ${passed}/${total}</strong> — 当前网络环境无法访问第三方 API。<br>
                部署到 GitHub Pages 后将使用 Mock 数据（依然可演示）。如需实时数据，请添加 CORS 代理。`;
        }
        
        document.getElementById('results').textContent = JSON.stringify(results, null, 2);
    }
    </script>
</body>
</html>
